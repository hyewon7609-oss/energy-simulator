<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>광합성 실험 데이터 수집</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:'Malgun Gothic',sans-serif;
    margin:20px;
    background:#f4f7f6;
}

h1,h2{
    text-align:center;
    color:#1e3d2f;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#2e7d32;
    color:white;
}

input,
select{

    width:90%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
    text-align:center;
    font-size:14px;
}

.button-wrap{

    margin-top:20px;
    text-align:center;
}

button{

    background:#2e7d32;
    color:white;
    border:none;
    padding:12px 20px;
    margin:5px;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
}

button:hover{

    background:#1b5e20;
}

.chart-wrap{

    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.chart-box{

    flex:1;
    min-width:350px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container">

<h1>🌱 식물의 광합성 반응 측정 실험</h1>
<h2>시간에 따른 산소·이산화탄소 농도 변화</h2>

<div class="card">

<h3>학생 정보 입력</h3>

<table>

<tr>

<th>반</th>

<td>

<select id="className">

<option value="2-1">2학년 1반</option>
<option value="2-2">2학년 2반</option>
<option value="2-3">2학년 3반</option>
<option value="2-4">2학년 4반</option>

</select>

</td>

<th>모둠</th>

<td>
<input type="text"
       id="groupName"
       placeholder="예 : 1모둠">
</td>

<th>이름</th>

<td>
<input type="text"
       id="studentName"
       placeholder="예 : 홍길동">
</td>

</tr>

</table>

</div>
<div class="card">

<h3>📊 실험 데이터 입력</h3>

<table>

<thead>

<tr>

<th>시간(분)</th>

<th>산소 농도 (%)</th>

<th>이산화탄소 농도 (ppm)</th>

</tr>

</thead>

<tbody id="inputRows">

<tr>
<td>0분</td>
<td><input type="number" step="0.01" class="o2-input"></td>
<td><input type="number" step="1" class="co2-input"></td>
</tr>

<tr>
<td>1분</td>
<td><input type="number" step="0.01" class="o2-input"></td>
<td><input type="number" step="1" class="co2-input"></td>
</tr>

<tr>
<td>2분</td>
<td><input type="number" step="0.01" class="o2-input"></td>
<td><input type="number" step="1" class="co2-input"></td>
</tr>

<tr>
<td>3분</td>
<td><input type="number" step="0.01" class="o2-input"></td>
<td><input type="number" step="1" class="co2-input"></td>
</tr>

<tr>
<td>4분</td>
<td><input type="number" step="0.01" class="o2-input"></td>
<td><input type="number" step="1" class="co2-input"></td>
</tr>

<tr>
<td>5분</td>
<td><input type="number" step="0.01" class="o2-input"></td>
<td><input type="number" step="1" class="co2-input"></td>
</tr>

</tbody>

</table>

<div class="button-wrap">

<button onclick="drawGraphs()">
📈 그래프 생성
</button>

<button onclick="downloadGraphs()">
💾 그래프 저장
</button>

<button onclick="submitData()">
📤 결과 제출
</button>

</div>

</div>

<div class="chart-wrap">

<div class="chart-box">

<h3>산소(O₂) 변화</h3>

<canvas id="o2Chart"></canvas>

</div>

<div class="chart-box">

<h3>이산화탄소(CO₂) 변화</h3>

<canvas id="co2Chart"></canvas>

</div>

</div>
<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw8VCFLh8Ddgj_18Rj7Vw1mws9yo8MigJ3ioURBFWap0M4yWjULtIyzvVp0LlmqhF6m/exec";

let o2Chart = null;
let co2Chart = null;

function drawGraphs(){

    const labels =
    ['0분','1분','2분','3분','4분','5분'];

    const o2Values =
    Array.from(
        document.querySelectorAll('.o2-input')
    ).map(el => parseFloat(el.value));

    const co2Values =
    Array.from(
        document.querySelectorAll('.co2-input')
    ).map(el => parseFloat(el.value));

    if(
        o2Values.some(isNaN) ||
        co2Values.some(isNaN)
    ){
        alert("모든 값을 입력하세요.");
        return;
    }

    const o2Min =
    Math.min(...o2Values) - 0.02;

    const o2Max =
    Math.max(...o2Values) + 0.02;

    if(o2Chart) o2Chart.destroy();

    o2Chart = new Chart(
        document.getElementById('o2Chart'),
        {
            type:'line',

            data:{
                labels:labels,
                datasets:[{
                    label:'산소 농도 (%)',
                    data:o2Values,
                    borderWidth:3,
                    tension:0.2
                }]
            },

            options:{
                responsive:true,

                scales:{
                    y:{
                        min:o2Min,
                        max:o2Max
                    }
                }
            }
        }
    );

    if(co2Chart) co2Chart.destroy();

    co2Chart = new Chart(
        document.getElementById('co2Chart'),
        {
            type:'line',

            data:{
                labels:labels,
                datasets:[{
                    label:'이산화탄소 농도(ppm)',
                    data:co2Values,
                    borderWidth:3,
                    tension:0.2
                }]
            },

            options:{
                responsive:true
            }
        }
    );
}

function downloadGraphs(){

    alert(
      "그래프는 아이패드에서 화면 캡처로 저장하는 것을 권장합니다."
    );
}

async function submitData(){

    const className =
    document.getElementById(
        'className'
    ).value;

    const group =
    document.getElementById(
        'groupName'
    ).value;

    const name =
    document.getElementById(
        'studentName'
    ).value;

    const o2Values =
    Array.from(
        document.querySelectorAll('.o2-input')
    ).map(el => parseFloat(el.value));

    const co2Values =
    Array.from(
        document.querySelectorAll('.co2-input')
    ).map(el => parseFloat(el.value));

    if(
        !group ||
        !name
    ){
        alert(
            "반, 모둠, 이름을 입력하세요."
        );
        return;
    }

    if(
        o2Values.some(isNaN) ||
        co2Values.some(isNaN)
    ){
        alert(
            "모든 실험값을 입력하세요."
        );
        return;
    }

    const data = {https://github.com/hyewon7609-oss/energy-simulator/blob/main/index.html

        className: className,

        group: group,

        name: name,

        o2: o2Values,

        co2: co2Values
    };
alert(JSON.stringify(data,null,2));
    try{

        const response =
        await fetch(
            SCRIPT_URL,
            {
                method:"POST",
                body:JSON.stringify(data)
            }
        );

        if(response.ok){

            alert(
                "제출 완료되었습니다! ✅"
            );

        }else{

            alert(
                "제출 실패 😥"
            );
        }

    }catch(error){

        console.error(error);

        alert(
            "제출 실패 😥"
        );
    }
}

</script>

</body>
</html>
